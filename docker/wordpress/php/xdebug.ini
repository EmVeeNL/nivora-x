[xdebug]
; Controlled by XDEBUG_MODE env var (set in .env / docker-compose).
; Default is "off" so normal page loads stay fast.
; For step-debugging:  XDEBUG_MODE=debug
; For coverage:        XDEBUG_MODE=coverage
xdebug.mode = ${XDEBUG_MODE}
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = yes
xdebug.log_level = 0
